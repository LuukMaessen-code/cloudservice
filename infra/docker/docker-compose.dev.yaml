services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    networks: [cloudservice]

  gateway:
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile.dev
    environment:
      NATS_URL: "nats://nats:4222"
      PYTHONPATH: "/app:/app/packages"
    volumes:
      - ../../services/gateway/app:/app/app
      - ../../packages:/app/packages
    depends_on: [nats]
    ports:
      - "8000:8000"
    networks: [cloudservice]

  history:
    build:
      context: ../..
      dockerfile: services/history_service/Dockerfile.dev
    environment:
      NATS_URL: "nats://nats:4222"
      STORAGE_PATH: "/data/history"
      PYTHONPATH: "/app:/app/packages"
    volumes:
      - ../../services/history_service/app:/app/app
      - ../../packages:/app/packages
      - ../../data:/data
    depends_on: [nats]
    ports:
      - "9000:9000"
    networks: [cloudservice]

  frontend:
    build:
      context: ../../frontend/web
      dockerfile: Dockerfile.dev
    environment:
      VITE_GATEWAY_URL: "http://localhost:8000"
      VITE_HISTORY_URL: "http://localhost:9000"
    volumes:
      - ../../frontend/web:/web
      - /web/node_modules
    depends_on: [gateway, history]
    ports:
      - "5173:5173"
    networks: [cloudservice]

networks:
  cloudservice: {}

