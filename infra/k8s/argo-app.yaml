apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudservice
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/LuukMaessen-code/cloudservice'
    targetRevision: HEAD
    path: infra/k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: cloudservice
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
