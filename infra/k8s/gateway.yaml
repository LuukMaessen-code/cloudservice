apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: cloudservice-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: luukmn/cloudservice-gateway:latest
          imagePullPolicy: Always
          env:
            - name: NATS_URL
              value: nats://nats.cloudservice-demo.svc.cluster.local:4222
            - name: PYTHONPATH
              value: /app:/app/../packages
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: cloudservice-demo
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8000
      targetPort: 8000
      name: http
