version: '3.8'
services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile.dev
    environment:
      NATS_URL: nats://localhost:4222
      PYTHONPATH: /app:/app/../packages
      HISTORY_API_URL: http://localhost:9000
    ports:
      - "8000:8000"
    depends_on:
      - nats
      - history
  history:
    build:
      context: ./services/history_service
      dockerfile: Dockerfile.dev
    environment:
      NATS_URL: nats://localhost:4222
      STORAGE_PATH: /data/history
      PYTHONPATH: /app:/app/../packages
    ports:
      - "9000:9000"
    volumes:
      - history-data:/data
    depends_on:
      - nats
  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    environment:
      VITE_GATEWAY_URL: http://localhost:8000
      VITE_HISTORY_URL: http://localhost:9000
    ports:
      - "5173:80"
    depends_on:
      - gateway
      - history
volumes:
  history-data:
    driver: local
